{# SEC-1 (PHASE 28): password-reset email body.
   Inline-styled HTML — email clients strip most external CSS, and
   even <style> in <head> is unreliable. Kept minimal + RTL Arabic.
   Rendered by app/services/mail.py::send_password_reset_email. #}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
</head>
<body style="margin:0; padding:0; background:#f4f6fa; font-family:'Segoe UI', Tahoma, Arial, sans-serif; color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="background:#ffffff; border-radius:12px; box-shadow:0 1px 3px rgba(15,23,42,0.08); overflow:hidden;">
          {# Sky-blue brand strip — matches the app's main accent. #}
          <tr>
            <td style="background:#43b9e9; padding:18px 24px; color:#ffffff; font-weight:700; font-size:18px; text-align:right;">
              {{ app_name }}
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px; text-align:right; font-size:16px; line-height:1.7;">
              مرحبًا {{ user.full_name or 'مستخدم' }}،
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 20px; text-align:right; font-size:14px; line-height:1.8; color:#4b5563;">
              وصلنا طلب إعادة تعيين كلمة المرور لحسابك على <strong>{{ app_name }}</strong>.
              اضغط على الزر بالأسفل لتعيين كلمة مرور جديدة — الرابط صالح
              لمدة <strong>ساعتين</strong> فقط من وقت الطلب.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 28px 24px;">
              <a href="{{ reset_url }}"
                 style="display:inline-block; background:#43b9e9; color:#ffffff; text-decoration:none;
                        padding:12px 28px; border-radius:8px; font-weight:700; font-size:15px;">
                إعادة تعيين كلمة المرور
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 8px; text-align:right; font-size:12px; color:#6b7280; line-height:1.6;">
              أو انسخ الرابط التالي والصقه في المتصفح:
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 24px; text-align:left; font-size:12px; word-break:break-all;">
              <a href="{{ reset_url }}" style="color:#0369a1; text-decoration:underline;">{{ reset_url }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px; border-top:1px solid #e5e7eb; text-align:right;
                       font-size:12px; color:#6b7280; line-height:1.7;">
              لو مطلبتش ده، تجاهل الرسالة — كلمة المرور الحالية هتفضل زي ما هي،
              ومحدش يقدر يستخدم الرابط من غير ما يفتحه من إيميلك.
            </td>
          </tr>
        </table>
        <div style="max-width:560px; margin:12px auto 0; font-size:11px; color:#9ca3af; text-align:center;">
          رسالة تلقائية — لا يتم الرد عليها.
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
